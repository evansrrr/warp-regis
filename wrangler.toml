name = "warp-regis"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# No bindings are required. Devices are kept in the Cloudflare Cache API,
# so a bare `wrangler deploy` is enough to get a working instance.

# Optional shared secret. Prefer `wrangler secret put REGIS_KEY` over committing
# a value here; a plain var also works for a non-sensitive deployment.
# [vars]
# REGIS_KEY = "change-me"

[observability]
enabled = true
