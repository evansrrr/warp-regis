version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cloudflare:
        patterns:
          - "@cloudflare/*"
          - wrangler
      tooling:
        patterns:
          - eslint*
          - prettier
          - typescript*
          - vitest
          - esbuild

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
